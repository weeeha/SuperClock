# Every guarantee this repo makes is a test or a lint rule — but until now
# they only ran when someone remembered. This gate makes them structural:
# lint + vitest (registry coherence, navigation invariants, time-window,
# fleet-store) + a full two-SPA build on every PR and every push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
