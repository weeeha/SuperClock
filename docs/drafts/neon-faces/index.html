<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon faces</title>
<style>
  :root {
    --stage: #04040a;
    --page: #0b0b10;
    --ink: #eef0f6;
    --muted: #9497a6;
    --line: #22232c;
    --bezel: #15161d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--page); color: var(--ink); font: 16px/1.45 Inter, system-ui, sans-serif; }
  header { max-width: 1480px; margin: 0 auto; padding: 40px 48px 8px; }
  h1 { font-size: 28px; font-weight: 600; }
  header p { color: var(--muted); margin-top: 6px; max-width: 70ch; }
  nav { display: flex; gap: 20px; margin-top: 14px; font-size: 15px; }
  nav a { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line); }
  #grid { max-width: 1480px; margin: 0 auto; padding: 28px 48px 64px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 44px 32px; }
  .card { display: flex; flex-direction: column; gap: 8px; }
  .disc { position: relative; display: block; width: 100%; aspect-ratio: 1; border-radius: 50%; overflow: hidden; border: 0; padding: 0; cursor: zoom-in; background: var(--stage); box-shadow: 0 0 0 10px var(--bezel); }
  .disc:focus-visible { outline: 2px solid var(--ink); outline-offset: 14px; }
  .disc canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .disc.empty { display: grid; place-items: center; cursor: default; color: var(--muted); }
  .err { position: absolute; inset: auto 0 18% 0; text-align: center; font-size: 13px; color: #ff9aa6; }
  h2 { font-size: 17px; font-weight: 600; margin-top: 10px; }
  .hue { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; }
  .chip { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .idea { color: var(--muted); font-size: 14px; }
  #focus { position: fixed; inset: 0; background: rgba(4, 4, 10, 0.96); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; z-index: 10; }
  #focus[hidden] { display: none; }
  #focus .disc { width: min(86vmin, 1080px); cursor: zoom-out; }
  #focus h2 { margin: 0; }
  #focus .idea { max-width: 60ch; text-align: center; }
  body.solo { background: #000; overflow: hidden; }
  body.solo header, body.solo #grid, body.solo #focus { display: none; }
  .solo-canvas { display: block; width: 100vmin; height: 100vmin; border-radius: 50%; }
</style>
</head>
<body>
<header>
  <h1>Neon faces</h1>
  <p>Twenty draft faces for the round 1080 display, drawn live at the real time. Click a face to see it full size. Draft only: nothing here is in the kiosk yet.</p>
  <nav>
    <a href="?">Live</a>
    <a href="?t=10:09:30">Freeze at 10:09:30</a>
    <a href="?speed=60">Run 60 times faster</a>
  </nav>
</header>
<main id="grid"></main>
<div id="focus" hidden>
  <button class="disc" onclick="closeFocus()" aria-label="Close full size view"><canvas></canvas></button>
  <h2></h2>
  <p class="idea"></p>
</div>
<script src="neon.js"></script>
<script src="gallery.js"></script>
</body>
</html>
